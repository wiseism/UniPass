plugins {
    id 'base'
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    // Pure-frontend portal module; same pinned toolchain as Maven's frontend-maven-plugin 2.0.2.
    id 'com.github.node-gradle.node' version '7.1.0' apply false
    id 'com.diffplug.spotless' version '6.25.0' apply false
}

allprojects {
    group = 'com.unipass'
    version = '0.1.0-SNAPSHOT'
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.diffplug.spotless'

    repositories {
        // Optional development cache; CI resolves the same pinned coordinates from Central.
        def localRepository = providers.gradleProperty('localMavenRepository')
        if (localRepository.isPresent()) {
            maven {
                url = uri(localRepository.get())
                metadataSources { mavenPom(); artifact() }
            }
        }
        mavenCentral()
    }
    java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
    spotless {
        java {
            target 'src/**/*.java'
            googleJavaFormat('1.22.0')
            trimTrailingWhitespace()
            endWithNewline()
        }
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = 17
        options.encoding = 'UTF-8'
        options.compilerArgs.add('-parameters')
    }

    dependencyManagement {
        imports {
            if (project.name in ['iam-server', 'iam-web']) {
                mavenBom 'org.springframework.boot:spring-boot-dependencies:3.5.16'
            }
            mavenBom 'io.zonky.test.postgres:embedded-postgres-binaries-bom:17.6.0'
            mavenBom 'org.junit:junit-bom:5.13.4'
        }
        if (!(project.name in ['iam-server', 'iam-web'])) {
            // Maven's nearer domain JDBC dependency wins over the embedded test tool's JDBC.
            dependencies { dependency 'org.postgresql:postgresql:42.7.8' }
        }
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        maxParallelForks = 1
        workingDir = projectDir
        testLogging { events 'failed', 'skipped'; exceptionFormat = 'full' }
        // Explicit properties avoid propagating arbitrary host credentials into test JVMs.
        def redis = providers.gradleProperty('testRedisExecutable')
                .orElse(providers.environmentVariable('UNIPASS_TEST_REDIS_EXECUTABLE'))
        if (redis.isPresent()) systemProperty 'test.redis.executable', redis.get()
    }
    tasks.named('test', Test) { exclude '**/*IT.class' }
    tasks.register('integrationTest', Test) {
        description = 'Runs real PostgreSQL/Redis and packaged CLI integration tests.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        include '**/*IT.class'
        shouldRunAfter tasks.named('test')
    }
    tasks.named('check') { dependsOn tasks.named('integrationTest') }
    tasks.named('check') { dependsOn 'spotlessCheck' }
    tasks.withType(Jar).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

tasks.named('build') { dependsOn subprojects.collect { it.tasks.named('build') } }
tasks.named('check') { dependsOn subprojects.collect { it.tasks.named('check') } }
tasks.named('clean') { dependsOn subprojects.collect { it.tasks.named('clean') } }
